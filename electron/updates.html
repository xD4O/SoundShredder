<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>SoundShredder updates</title>
<style>
:root{color-scheme:dark;font:14px 'Segoe UI',sans-serif;color:#e4eef1;background:#090e15}*{box-sizing:border-box}body{margin:0;padding:32px;background:radial-gradient(ellipse at top right,#183c3380,transparent 65%);min-height:100vh}header{display:flex;justify-content:space-between;color:#8ca8ab;font-size:10px;letter-spacing:1.5px}.mark{color:#8af5d0;font-weight:700}h1{font-size:35px;letter-spacing:-1.3px;font-weight:500;margin:35px 0 12px}h1 em{font-style:normal;color:#8af5d0}.sub{color:#9aafb8;line-height:1.6;font-size:12px}section{border:1px solid #345247;border-radius:14px;background:#121e2580;padding:22px;margin:22px 0}#status{color:#8af5d0;font-size:10px;letter-spacing:1.3px;text-transform:uppercase}#message{font-size:17px;line-height:1.5;margin:13px 0}#versions,#size,#transfer{color:#a2b7bf;font-size:12px;line-height:1.7}progress{accent-color:#8af5d0;width:100%;height:7px;margin:15px 0 8px}details{margin-top:15px;border-top:1px solid #293b43;padding-top:15px;font-size:12px}summary{cursor:pointer;color:#b6cbd0}#notes{white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;color:#adc1c8;line-height:1.7;font:12px 'Segoe UI',sans-serif}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #3a5355;border-radius:7px;padding:11px 16px;background:#17252d;color:#d7e8e8}button.primary{background:#8af5d0;color:#09261d;border-color:#8af5d0;font-weight:600}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid #baffeb;outline-offset:3px}.footer{margin-top:25px;display:flex;justify-content:space-between;gap:15px;color:#869ea7;font-size:11px;line-height:1.6}.link{padding:0;border:0;background:none;color:#aad8c9;font-size:11px}[hidden]{display:none!important}
</style><script src="updates-ui.cjs" defer></script></head>
<body><header><span class="mark">SOUNDSHREDDER</span><span>DESKTOP UPDATES</span></header>
<h1>Stay in the <em>flow.</em></h1><p class="sub">Keep your workspace current. Your sessions, storage choice and compatible downloaded engines stay with you.</p>
<section><span id="status">Checking</span><p id="message" role="status" aria-live="polite">Opening update controls…</p><div id="versions"></div><div id="size"></div><progress id="progress" max="100" value="0" aria-label="Update download progress" hidden></progress><div id="transfer" hidden></div><details id="release-notes" hidden><summary>Release notes</summary><pre id="notes"></pre></details></section>
<div class="actions"><button id="primary" class="primary" disabled>Check for updates</button><button id="cancel" hidden>Cancel download</button><button id="later">Later</button></div>
<div class="footer"><span>Install when your audio work is finished.<br>Closing this panel keeps a download running.</span><button id="releases" class="link">GitHub releases ↗</button></div>
</body></html>
