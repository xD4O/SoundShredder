appId: com.cyr4x.soundshredder.electron
productName: SoundShredder
directories:
  output: ../artifacts/electron/dist
  buildResources: ../desktop
files:
  - '*.cjs'
  - '*.html'
  - package.json
  - '!electron-builder*'
extraResources:
  - from: ../artifacts/electron/backend
    to: backend
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc']
asar: true
publish: null
win:
  icon: ../desktop/icon.ico
  target: [nsis]
  artifactName: SoundShredder-Electron-${version}-Windows-${arch}-Setup.${ext}
nsis:
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
mac:
  icon: ../artifacts/electron/SoundShredder.icns
  category: public.app-category.music
  target: [dmg, zip]
  minimumSystemVersion: '13.0'
  # Ad-hoc signing seals the bundle for testing; it does not establish Apple trust.
  identity: '-'
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: false
  strictVerify: true
  artifactName: SoundShredder-Electron-${version}-macOS-${arch}.${ext}
dmg:
  title: SoundShredder
  contents:
    - x: 130
      y: 180
    - x: 410
      y: 180
      type: link
      path: /Applications
