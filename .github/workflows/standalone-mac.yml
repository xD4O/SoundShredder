name: Mac standalone lifecycle
on:
  push:
    branches: [main, 'codex/standalone-relaunch']
    paths: ['desktop/**', 'scripts/*standalone*', 'scripts/verify_mac_lifecycle.py', 'tests/test_desktop*', 'tests/test_mac_standalone.py', 'soundshredder/__init__.py', '.github/workflows/standalone-mac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Launcher regression tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_desktop.py tests/test_desktop_lifecycle.py tests/test_mac_standalone.py -q
      - name: Build native application
        run: python scripts/build_mac_standalone.py --arch '${{ matrix.arch }}'
      - name: Install, reopen, close and relaunch through Launch Services
        run: python scripts/verify_mac_lifecycle.py artifacts/mac-standalone/SoundShredder-*-Mac-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-${{ matrix.label }}
          path: |
            artifacts/mac-standalone/SoundShredder-*.zip
            artifacts/mac-standalone/build.json
            artifacts/mac-standalone/SoundShredder-launcher
            artifacts/mac-lifecycle/verification.json
            artifacts/mac-lifecycle/Test profile with spaces/*.log
