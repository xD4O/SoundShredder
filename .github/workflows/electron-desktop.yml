name: Electron desktop builds and lifecycle
on:
  push:
    branches: [main, 'codex/electron-desktop']
    paths: ['electron/**', 'desktop/bootstrap.py', 'desktop/setup.html', 'desktop/lifetime.py', 'scripts/prepare_electron.py', 'scripts/electron_artifacts.py', 'scripts/verify_mac_distribution.py', 'tests/test_mac_distribution.py', 'soundshredder/**', '.github/workflows/electron-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Python lifecycle regressions
        run: |
          python -m pip install pytest
          python -m pytest tests/test_desktop.py tests/test_desktop_lifecycle.py tests/test_mac_standalone.py tests/test_mac_distribution.py -q
      - name: Stage private runtime and shared interface
        run: python scripts/prepare_electron.py
      - name: Install desktop build tools
        working-directory: electron
        run: npm ci --no-fund
      - name: Desktop boundary tests
        working-directory: electron
        run: npm test
      - name: Package desktop application
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Locate packaged application
        run: python scripts/electron_artifacts.py executable
      - name: Verify DMG and ZIP signatures and install a copy for lifecycle testing
        if: matrix.platform == 'mac'
        run: python scripts/verify_mac_distribution.py
      - name: Test real CPU separation, export, close and relaunch
        working-directory: electron
        run: npm run test:app
      - name: Verify installed app remains sealed after processing and relaunch
        if: matrix.platform == 'mac'
        run: python scripts/verify_mac_distribution.py --after-lifecycle
      - name: Collect matching platform guide and checksums
        run: python scripts/electron_artifacts.py collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/electron/dist/*.exe
            artifacts/electron/dist/*.dmg
            artifacts/electron/dist/*.zip
            artifacts/electron/dist/*-INSTALL.md
            artifacts/electron/dist/SHA256SUMS.txt
            artifacts/electron/verification/*
            artifacts/electron/QA profile with spaces/*.log
            artifacts/electron/QA profile with spaces/data/*/worker.log
            artifacts/electron/QA profile with spaces/data/*/progress.json
