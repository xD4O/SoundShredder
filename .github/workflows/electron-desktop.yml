name: Electron desktop builds and lifecycle
on:
  push:
    branches: [main, 'codex/electron-desktop']
    paths: ['electron/**', 'desktop/bootstrap.py', 'desktop/setup.html', 'desktop/lifetime.py', 'scripts/prepare_electron.py', 'scripts/electron_artifacts.py', 'scripts/verify_mac_distribution.py', 'scripts/test_windows_installer.ps1', 'tests/test_mac_distribution.py', 'tests/test_setup_responsiveness.py', 'soundshredder/**', '.github/workflows/electron-desktop.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build and test all desktop platforms, Windows only, or both Mac architectures'
        required: true
        type: choice
        default: all
        options: [all, windows, mac]
      mac_signing:
        description: 'Mac test signing or Developer ID plus notarization (requires configured secrets)'
        required: true
        type: choice
        default: adhoc
        options: [adhoc, developer-id]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"runner":"windows-latest","platform":"win","arch":"x64"}]' || inputs.platform == 'mac' && '[{"runner":"macos-15","platform":"mac","arch":"arm64"},{"runner":"macos-15-intel","platform":"mac","arch":"x64"}]' || '[{"runner":"windows-latest","platform":"win","arch":"x64"},{"runner":"macos-15","platform":"mac","arch":"arm64"},{"runner":"macos-15-intel","platform":"mac","arch":"x64"}]') }}
    runs-on: ${{ matrix.runner }}
    # Apple's review may consume most of the old 45-minute job budget. Leave
    # a separate window for the installed-app processing and relaunch checks.
    timeout-minutes: ${{ matrix.platform == 'mac' && inputs.mac_signing == 'developer-id' && 120 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Verify Apple notarization login before downloading build inputs
        if: matrix.platform == 'mac' && inputs.mac_signing == 'developer-id'
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node build/check-notarization.cjs
      - name: Python lifecycle regressions
        run: |
          python -m pip install pytest
          python -m pytest tests/test_desktop.py tests/test_desktop_lifecycle.py tests/test_setup_responsiveness.py tests/test_mac_standalone.py tests/test_mac_distribution.py -q
      - name: Stage private runtime and shared interface
        run: python scripts/prepare_electron.py
      - name: Install desktop build tools
        working-directory: electron
        run: npm ci --no-fund
      - name: Desktop boundary tests
        working-directory: electron
        run: |
          npm test
          npm run test:setup-ui
      - name: Package desktop application
        if: matrix.platform != 'mac' || inputs.mac_signing != 'developer-id'
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Sign and notarize Mac application with Developer ID
        if: matrix.platform == 'mac' && inputs.mac_signing == 'developer-id'
        timeout-minutes: 90
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node build/notarized.cjs
      - name: Locate packaged application
        run: python scripts/electron_artifacts.py executable
      - name: Test Windows install, reinstall, uninstall and retained sessions
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1
      - name: Verify DMG and ZIP signatures and install a copy for lifecycle testing
        if: matrix.platform == 'mac'
        run: python scripts/verify_mac_distribution.py ${{ inputs.mac_signing == 'developer-id' && '--require-notarized' || '' }}
      - name: Test real CPU separation, export, close and relaunch
        working-directory: electron
        run: npm run test:app
      - name: Test folder selection, retained profiles and disconnected-drive recovery
        working-directory: electron
        run: npm run test:storage-ui
      - name: Verify installed app remains sealed after processing and relaunch
        if: matrix.platform == 'mac'
        run: python scripts/verify_mac_distribution.py --after-lifecycle ${{ inputs.mac_signing == 'developer-id' && '--require-notarized' || '' }}
      - name: Collect matching platform guide and checksums
        run: python scripts/electron_artifacts.py collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/electron/dist/*.exe
            artifacts/electron/dist/*.dmg
            artifacts/electron/dist/*.zip
            artifacts/electron/dist/*-INSTALL.md
            artifacts/electron/dist/SHA256SUMS.txt
            artifacts/electron/verification/*
            artifacts/electron/QA profile with spaces/*.log
            artifacts/electron/QA profile with spaces/data/*/worker.log
            artifacts/electron/QA profile with spaces/data/*/progress.json
            artifacts/electron/Chosen engine storage/SoundShredder/*.log
            artifacts/electron/Chosen engine storage/SoundShredder/data/*/worker.log
            artifacts/electron/Chosen engine storage/SoundShredder/data/*/progress.json
